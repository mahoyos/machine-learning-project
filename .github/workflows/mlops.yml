name: MLOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-train-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        env:
          PYTHONPATH: .
        run: |
          echo "Entrenando el modelo..."
          python src/train.py

      - name: Evaluate Model & Track with MLflow
        env:
          PYTHONPATH: .
        run: |
          echo "Evaluando el modelo..."
          python src/evaluate.py

      - name: Validate Model Thresholds
        env:
          PYTHONPATH: .
        run: |
          echo "Validando métricas de performance..."
          python src/validate.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model
          path: models/model.pkl

      - name: Upload MLflow Tracking Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlruns
          path: |
            mlruns/
            mlruns.db

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: reports/metrics.json

      - name: Track model with DVC
        run: |
            # Instalar dependencias globales necesarias para dvc
            dvc add models/model.pkl

      - name: Push model to DVC remote
        env:
            DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
            DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
        run: |
            # Ajustamos la inyección para usar explícitamente el token HTTP como Basic Auth directo
            dvc remote add -d dagshub https://${{ vars.DAGSHUB_USER }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ vars.DAGSHUB_REPO }}.dvc --force
            
            rm -f .dvc/tmp/lock
            
            # Ejecutamos el push sin depender de http puro (usando auth_header o s3)
            dvc push -r dagshub

